services:
  db:
    image: postgis/postgis:16-3.4
    container_name: wildbound-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wildbound
    ports:
      - "5432:5432"
    volumes:
      - wildbound-db:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wildbound"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  wildbound-db:
